<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<style>
    body {
        font-family: 'Merriweather', serif;
        margin: 0;
        padding: 0;
        background: white;
        /* Changed background to white */
        color: #1b1f3b;
    }

    .navbar-brand,
    .nav-link {
        color: white !important;
    }

    .navbar {
        background-color: #1b1f3b !important;
        /* Navy blue */
    }

    .nav-link:hover {
        color: #4caf50 !important;
        /* Green */
    }

    .nav-link {
        font-size: 18px;
        /* Increased font size */
        margin-right: 20px;
        /* Added spacing between links */
    }

    /* Custom SweetAlert2 styling */
    .swal2-popup {
        border-radius: 12px !important;
        padding: 30px !important;
        /* Add more space inside the modal */
    }

    .swal2-title {
        margin-top: 20px !important;
        /* Add more space above the title */
        margin-bottom: 30px !important;
        /* Add more space below the title */
        font-size: 24px !important;
        /* Increase font size for better readability */
    }

    .swal2-actions {
        margin-top: 20px !important;
        /* Add more space above the buttons */
        gap: 20px;
        /* Add space between buttons */
    }

    /* Custom button styling */
    .swal2-confirm {
        background-color: #2196F3 !important;
        /* Light blue for "Yes" button */
        border: none;
        padding: 10px 20px !important;
        /* Add padding to buttons */
        font-size: 16px !important;
        /* Increase font size */
    }

    .swal2-cancel {
        background-color: #4CAF50 !important;
        /* Green for "Cancel" button */
        border: none;
        padding: 10px 20px !important;
        /* Add padding to buttons */
        font-size: 16px !important;
        /* Increase font size */
    }

    .swal2-confirm:hover {
        background-color: #1e88e5 !important;
        /* Darker light blue on hover */
    }

    .swal2-cancel:hover {
        background-color: #45a049 !important;
        /* Darker green on hover */
    }
</style>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <div id="assetManagement"></div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/welcome/Lecturer">Assets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dash/Lecturer">History</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pending/Lecturer">Status</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="text-white mx-3">Welcome , <span id="Userrole">User</span></div>
                    <button class="btn btn-danger" onclick="Logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="addDetail">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let user_id, username, role;

        async function getSessionData() {
            try {
                const res = await fetch('/session');
                if (!res.ok) throw new Error("Not logged in");

                const session = await res.json();
                user_id = session.user_id;
                username = session.username;
                role = session.role;

                document.getElementById('Userrole').textContent = username;

            } catch (err) {
                console.error("Session error:", err);
            }
        }

        function Logout() {
            Swal.fire({
                title: "Do you want to Sign out",
                showCancelButton: true,
                confirmButtonText: "Yes",
            }).then((result) => {
                if (result.isConfirmed) {
                    location.replace('/logout');
                }
            });
        }

        document.getElementById('assetManagement').innerHTML = '<a class="navbar-brand" href="">Asset Borrowing System</a>';

        async function getAssetDetail() {
    const params = new URLSearchParams(window.location.search);
    const assetId = params.get('id');

    if (!assetId) {
        alert("Asset ID is missing in the URL.");
        return;
    }

    try {
        const response = await fetch(`/assets/${assetId}`);
        if (response.ok) {
            const asset = await response.json();
            let row = `
                <h1 class="mb-4">Asset Detail</h1>
                <div class="card p-4">
                    <h3>${asset.name}</h3>
                    <p><strong>ID:</strong> <span>${asset.asset_id}</span></p>
                    <p><strong>Category:</strong>${asset.category}</p>
                    <p><strong>Status:</strong> <span>${asset.status}</span></p>
                    <p><strong>Description:</strong> <span>${asset.description}</span></p>
            `;

            if (asset.status === 'available') {
                row += `<button id="borrow-button" onclick="borrowbutton()" class="btn btn-success">Borrow</button>`;
            } else {
                row += `<button id="Not-Allowed" class="btn btn-danger">Not allowed</button>`;
            }

            row += `</div>`;
            document.querySelector('#addDetail').innerHTML = row;

            // Call the disableButton function here AFTER rendering
            disableButton();

        } else {
            throw new Error('Asset not found');
        }
    } catch (err) {
        console.error(err);
        alert(err.message);
    }
}
        function disableButton() {
            const btn = document.getElementById("borrow-button");
            if (btn) {
                btn.disabled = true;
                btn.innerText = "Not allowed";
                btn.classList.remove("btn-success");
                btn.classList.add("btn-secondary");
            }
        }
getAssetDetail();
getSessionData();

    </script>
</body>

</html>
