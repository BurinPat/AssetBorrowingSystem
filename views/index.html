<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Borrowing System - Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            background: #ffffff;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #1b1f3b;
        }
        .btn-primary {
            background-color: #1b1f3b; /* Navy blue */
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #2c3e50; /* Darker navy blue */
        }
        .btn-success {
            background-color: #4caf50; /* Green */
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-success:hover {
            background-color: #45a049; /* Darker green */
        }
        .toggle-link {
            cursor: pointer;
            font-weight: bold;
            color: #1b1f3b; /* Navy blue */
            transition: 0.3s;
        }
        .toggle-link:hover {
            text-decoration: underline;
            color: #2c3e50; /* Darker navy blue */
        }
        h2.text-primary {
            color: #1b1f3b !important; /* Navy blue */
        }
        h2.text-success {
            color: #4caf50 !important; /* Green */
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow">
                    <!-- Login Section -->
                    <div id="loginSection">
                        <h2 class="text-center mb-4 fw-bold text-primary">Welcome Back</h2>
                        <p class="text-center text-muted">Login to continue</p>
                        <form id="loginForm">
                            <div class="mb-3">
                                <input type="text" class="form-control p-2" placeholder="Username" id="username" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control p-2" placeholder="Password" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 p-2">Login</button>
                        </form>
                        <p class="text-center mt-3">Not registered? <span class="toggle-link" onclick="showRegister()">Register here</span></p>
                    </div>

                    <!-- Registration Section (Initially Hidden) -->
                    <div id="registerSection" class="d-none">
                        <h2 class="text-center mb-4 fw-bold text-success">Create Account</h2>
                        <p class="text-center text-muted">Join us today</p>
                        <form id="formAdd">
                            <div class="mb-3">
                                <input type="text" class="form-control p-2" placeholder="Full Name" required name="full_name">
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control p-2" placeholder="Student ID" required name="student_id">
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control p-2" placeholder="Choose a Username" required name="username">
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control p-2" placeholder="Create a Password" required name="password">
                            </div>
                            <button type="submit" class="btn btn-success w-100 p-2">Register</button>
                        </form>
                        <p class="text-center mt-3">Already registered? <span class="toggle-link" onclick="showLogin()">Login here</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showRegister() {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('registerSection').classList.remove('d-none');
        }

        function showLogin() {
            document.getElementById('registerSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
        }

    <script src="/public/js/login.js"></script>
    <script src="/public/js/Registration.js"></script>
</body>
</html>
